<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZED 2i SLAM Test</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#ccc;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
#topbar{background:#1a1a2e;padding:8px 16px;display:flex;align-items:center;gap:16px}
#topbar h1{font-size:16px;font-weight:600}
.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px}
.status-dot.green{background:#4caf50}
.status-dot.yellow{background:#ff9800}
.status-dot.red{background:#f44336}
.status-dot.gray{background:#666}
#main{display:grid;grid-template-columns:2fr 2fr 3fr;gap:0;overflow:hidden}
#video-panel{position:relative;background:#000;overflow:hidden}
#video-panel img{width:100%;height:100%;object-fit:contain}
#video-overlay{position:absolute;bottom:8px;left:8px;font-size:12px;font-family:monospace;background:rgba(0,0,0,0.7);padding:6px 10px;border-radius:4px;pointer-events:none}
#depth-panel{position:relative;background:#000;overflow:hidden}
#depth-panel img{width:100%;height:100%;object-fit:contain}
#depth-overlay{position:absolute;bottom:8px;left:8px;font-size:12px;font-family:monospace;background:rgba(0,0,0,0.7);padding:6px 10px;border-radius:4px;pointer-events:none}
#scene-panel{position:relative;background:#1a1a1a;overflow:hidden}
#scene-panel canvas{display:block}
#bottombar{background:#1a1a2e;padding:8px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;font-family:monospace}
#bottombar .stat{white-space:nowrap}
#bottombar button{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
#btn-reset{background:#ff9800;color:#fff}
#btn-reset:hover{background:#f57c00}
#gear-btn{background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;padding:2px 8px;border-radius:4px}
#gear-btn:hover{color:#fff;background:rgba(255,255,255,0.1)}
.ml-auto{margin-left:auto}
.settings-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99;display:none}
.settings-overlay.open{display:block}
#settings-panel{position:fixed;top:0;right:-420px;width:400px;height:100%;background:#1e1e2e;z-index:100;overflow-y:auto;transition:right .3s ease;border-left:1px solid #333}
#settings-panel.open{right:0}
#settings-panel .header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #333;position:sticky;top:0;background:#1e1e2e;z-index:2}
#settings-panel .header h2{font-size:15px;font-weight:600}
#settings-panel .close-btn{background:none;border:none;color:#aaa;font-size:22px;cursor:pointer}
#settings-panel .close-btn:hover{color:#fff}
#settings-panel .apply-bar{padding:12px 16px;border-top:1px solid #333;position:sticky;bottom:0;background:#1e1e2e;display:flex;gap:8px}
#settings-panel .apply-bar button{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
#settings-panel .apply-bar .btn-apply{border:1px solid #4caf50;color:#4caf50;background:transparent;flex:1}
#settings-panel .apply-bar .btn-apply:hover{background:#4caf50;color:#fff}
#settings-panel .apply-bar .btn-apply-restart{background:#4caf50;color:#fff;flex:1}
#settings-panel .apply-bar .btn-apply-restart:hover{background:#388e3c}
#settings-panel .apply-bar .btn-apply:disabled,#settings-panel .apply-bar .btn-apply-restart:disabled{opacity:.4;cursor:default}
.restarting-msg{padding:12px 16px;background:#2d1b00;color:#ffa726;text-align:center;font-size:13px}
.section{border-bottom:1px solid #2a2a3a}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;user-select:none}
.section-header:hover{background:rgba(255,255,255,0.03)}
.section-header .label{font-size:13px;font-weight:600;color:#888}
.section-header .arrow{font-size:10px;color:#666;transition:transform .2s}
.section-header .arrow.open{transform:rotate(180deg)}
.section-body{padding:0 16px 10px;display:none}
.section-body.open{display:block}
.ctrl-row{display:flex;align-items:center;justify-content:space-between;padding:5px 0;min-height:30px}
.ctrl-row .ctrl-label{font-size:12px;color:#aaa;white-space:nowrap}
.ctrl-desc{font-size:10px;color:#666;line-height:1.3;padding:0 0 6px 0;border-bottom:1px solid #222;margin-bottom:4px}
.ctrl-group{padding:4px 0}
.ctrl-row select{background:#2a2a3a;color:#ccc;border:1px solid #444;border-radius:3px;padding:3px 6px;font-size:12px;max-width:180px}
.ctrl-row input[type=range]{width:100px;accent-color:#4caf50}
.ctrl-row .range-val{font-size:11px;color:#4caf50;min-width:32px;text-align:right;font-family:monospace}
.ctrl-row .switch{position:relative;width:36px;height:18px;flex-shrink:0}
.ctrl-row .switch input{opacity:0;width:0;height:0}
.ctrl-row .switch .slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:#444;border-radius:18px;transition:.2s}
.ctrl-row .switch .slider::before{content:"";position:absolute;height:14px;width:14px;left:2px;bottom:2px;background:#ccc;border-radius:50%;transition:.2s}
.ctrl-row .switch input:checked+.slider{background:#4caf50}
.ctrl-row .switch input:checked+.slider::before{transform:translateX(18px)}
@media(max-width:1000px){ #main{grid-template-columns:1fr;grid-template-rows:1fr 1fr 1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h1>ZED 2i SLAM</h1>
    <span id="camera-info">connecting...</span>
    <span class="ml-auto" id="top-status"><span class="status-dot gray"></span>offline</span>
    <button id="gear-btn">&#9881;</button>
  </div>
  <div id="main">
    <div id="video-panel">
      <img id="video-feed" src="/video_feed" alt="Camera feed">
      <div id="video-overlay"></div>
    </div>
    <div id="depth-panel">
      <img id="depth-feed" src="/depth_feed" alt="Depth feed">
      <div id="depth-overlay">depth (0–5m)</div>
    </div>
    <div id="scene-panel"></div>
  </div>
  <div id="bottombar">
    <span class="stat" id="stat-pose">pose: --</span>
    <span class="stat" id="stat-imu">imu: --</span>
    <span class="stat" id="stat-pc">pc: --</span>
    <span class="ml-auto"></span>
    <button id="btn-reset">Reset</button>
  </div>
</div>

<div class="settings-overlay" id="settings-overlay"></div>
<div id="settings-panel">
  <div class="header">
    <h2>Settings</h2>
    <button class="close-btn" id="settings-close">&times;</button>
  </div>
  <div id="settings-restart-msg" class="restarting-msg" style="display:none">&#9888; Camera restart required</div>
  <div id="settings-body"></div>
  <div class="apply-bar">
    <button class="btn-apply" id="btn-apply-runtime">Apply Runtime</button>
    <button class="btn-apply-restart" id="btn-apply-all">Apply &amp; Restart</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scenePanel = document.getElementById('scene-panel');
const W = scenePanel.clientWidth;
const H = scenePanel.clientHeight;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(50, W / H, 0.05, 500);
camera.position.set(5, 4, 8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
scenePanel.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.1;
controls.update();

const grid = new THREE.GridHelper(20, 20, 0x555555, 0x333333);
scene.add(grid);
const axesHelper = new THREE.AxesHelper(2);
scene.add(axesHelper);
const ambientLight = new THREE.AmbientLight(0x404040);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);

const camGroup = new THREE.Group();
const frustumGeo = new THREE.ConeGeometry(0.15, 0.3, 4);
frustumGeo.rotateX(-Math.PI / 2);
const frustumMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, wireframe: true });
const frustumMesh = new THREE.Mesh(frustumGeo, frustumMat);
frustumMesh.position.set(0, 0, -0.15);
camGroup.add(frustumMesh);
const camAxis = new THREE.AxesHelper(0.4);
camGroup.add(camAxis);
scene.add(camGroup);

const trailMax = 3000;
const trailPositions = new Float32Array(trailMax * 3);
const trailGeo = new THREE.BufferGeometry();
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
trailGeo.setDrawRange(0, 0);
const trailMat = new THREE.LineBasicMaterial({ color: 0x00ff88 });
const trailLine = new THREE.Line(trailGeo, trailMat);
scene.add(trailLine);

let pcObj = null;
const pcMat = new THREE.PointsMaterial({ color: 0x33aaff, size: 0.04, sizeAttenuation: true });

function buildPointCloud(verts) {
  if (pcObj) { scene.remove(pcObj); pcObj.geometry.dispose(); pcObj = null; }
  if (!verts || verts.length === 0) return;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(verts.length * 3);
  for (let i = 0; i < verts.length; i++) {
    pos[i * 3] = verts[i][0];
    pos[i * 3 + 1] = verts[i][1];
    pos[i * 3 + 2] = verts[i][2];
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  pcObj = new THREE.Points(geo, pcMat);
  scene.add(pcObj);
}

function updateTrail(path) {
  const n = Math.min(path.length, trailMax);
  for (let i = 0; i < n; i++) {
    const p = path[i].translation;
    trailPositions[i * 3] = p[0];
    trailPositions[i * 3 + 1] = p[1];
    trailPositions[i * 3 + 2] = p[2];
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.setDrawRange(0, n);
}

const videoOverlay = document.getElementById('video-overlay');
const topStatus = document.getElementById('top-status');
const cameraInfo = document.getElementById('camera-info');
const statPose = document.getElementById('stat-pose');
const statImu = document.getElementById('stat-imu');
const statPc = document.getElementById('stat-pc');
const btnReset = document.getElementById('btn-reset');

btnReset.addEventListener('click', () => fetch('/reset', { method: 'POST' }));

function updateUI(data) {
  const ts = data.tracking_state || 'OFF';
  const dot = topStatus.querySelector('.status-dot');
  if (ts === 'OK') { dot.className = 'status-dot green'; topStatus.innerHTML = '<span class="status-dot green"></span>tracking OK'; }
  else if (ts === 'SEARCHING') { dot.className = 'status-dot yellow'; topStatus.innerHTML = '<span class="status-dot yellow"></span>searching'; }
  else { dot.className = 'status-dot red'; topStatus.innerHTML = '<span class="status-dot red"></span>' + ts; }
  if (data.restart_pending) { topStatus.innerHTML = '<span class="status-dot yellow"></span>restarting...'; }

  if (data.camera_ready) cameraInfo.textContent = data.camera_model + ' (S/N: ' + data.serial + ')';
  if (data.pose) {
    const t = data.pose.translation;
    statPose.textContent = 'pose: x:' + t[0].toFixed(2) + ' y:' + t[1].toFixed(2) + ' z:' + t[2].toFixed(2);
  }
  if (data.imu) {
    const a = data.imu.acceleration, g = data.imu.angular_velocity;
    statImu.textContent = 'imu: a:[' + a[0].toFixed(1) + ',' + a[1].toFixed(1) + ',' + a[2].toFixed(1) + '] g:[' + g[0].toFixed(1) + ',' + g[1].toFixed(1) + ',' + g[2].toFixed(1) + ']';
  }
  statPc.textContent = 'pc: ' + data.mapping_state + (data.mapping_active ? ' (active)' : '');
  videoOverlay.textContent = 'fps: ' + data.fps + ' | tracking: ' + ts + ' | path: ' + data.path_length;
}

async function pollStatus() {
  try {
    const r = await fetch('/status');
    const data = await r.json();
    updateUI(data);
    if (data.pose) {
      camGroup.position.set(data.pose.translation[0], data.pose.translation[1], data.pose.translation[2]);
      camGroup.quaternion.set(data.pose.orientation[0], data.pose.orientation[1], data.pose.orientation[2], data.pose.orientation[3]);
      camGroup.updateMatrix();
    }
    if (data.restart_pending) document.getElementById('settings-restart-msg').style.display = 'block';
    else document.getElementById('settings-restart-msg').style.display = 'none';
  } catch (e) {}
}

async function pollPath() {
  try { const r = await fetch('/path'); const path = await r.json(); updateTrail(path); } catch (e) {}
}

async function pollPc() {
  try {
    const r = await fetch('/pc');
    const data = await r.json();
    if (data.vertices && data.vertices.length > 0) buildPointCloud(data.vertices);
  } catch (e) {}
}

// Settings panel
const settingsOverlay = document.getElementById('settings-overlay');
const settingsPanel = document.getElementById('settings-panel');
const settingsBody = document.getElementById('settings-body');
const gearBtn = document.getElementById('gear-btn');
const settingsClose = document.getElementById('settings-close');
const btnApplyRuntime = document.getElementById('btn-apply-runtime');
const btnApplyAll = document.getElementById('btn-apply-all');

let settingsCurrent = null;
let settingsOptions = null;
let settingsDescriptions = null;
let pendingChanges = {};
let changedSections = {};

gearBtn.addEventListener('click', openSettings);
settingsClose.addEventListener('click', closeSettings);
settingsOverlay.addEventListener('click', closeSettings);

function openSettings() {
  settingsPanel.classList.add('open');
  settingsOverlay.classList.add('open');
  loadSettings();
}

function closeSettings() {
  settingsPanel.classList.remove('open');
  settingsOverlay.classList.remove('open');
}

function sectionKey(section, key) { return section + '.' + key; }

function onControlChange(section, key, value) {
  if (!pendingChanges[section]) pendingChanges[section] = {};
  pendingChanges[section][key] = value;
  changedSections[section] = true;
  const restartNeeded = (section === 'init' || section === 'mapping');
  const hasChanges = Object.keys(pendingChanges).length > 0;
  btnApplyRuntime.disabled = !hasChanges || restartNeeded;
  btnApplyAll.disabled = !hasChanges;
}

function buildControl(section, key, value, options, description) {
  const group = document.createElement('div');
  group.className = 'ctrl-group';

  const container = document.createElement('div');
  container.className = 'ctrl-row';

  const label = document.createElement('span');
  label.className = 'ctrl-label';
  label.textContent = key.replace(/_/g, ' ');
  container.appendChild(label);

  const control = document.createElement('div');
  control.style.display = 'flex'; control.style.alignItems = 'center'; control.style.gap = '6px';

  if (options === 'bool') {
    const sw = document.createElement('label');
    sw.className = 'switch';
    const inp = document.createElement('input');
    inp.type = 'checkbox';
    inp.checked = value;
    inp.addEventListener('change', () => onControlChange(section, key, inp.checked));
    sw.appendChild(inp);
    const sl = document.createElement('span');
    sl.className = 'slider';
    sw.appendChild(sl);
    control.appendChild(sw);
  } else if (Array.isArray(options)) {
    const sel = document.createElement('select');
    options.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      if (String(opt) === String(value)) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', () => {
      const v = sel.value;
      const asNum = Number(v);
      onControlChange(section, key, Number.isFinite(asNum) ? asNum : v);
    });
    control.appendChild(sel);
  } else if (typeof options === 'object' && 'min' in options) {
    const range = document.createElement('input');
    range.type = 'range';
    range.min = options.min; range.max = options.max; range.step = options.step || 1;
    range.value = value;
    const valSpan = document.createElement('span');
    valSpan.className = 'range-val';
    valSpan.textContent = value;
    range.addEventListener('input', () => {
      const v = parseFloat(range.value);
      valSpan.textContent = v;
      onControlChange(section, key, v);
    });
    control.appendChild(range);
    control.appendChild(valSpan);
  }

  container.appendChild(control);
  group.appendChild(container);

  if (description) {
    const desc = document.createElement('div');
    desc.className = 'ctrl-desc';
    desc.textContent = description;
    group.appendChild(desc);
  }

  return group;
}

async function loadSettings() {
  try {
    const r = await fetch('/settings');
    const data = await r.json();
    settingsCurrent = data.current;
    settingsOptions = data.options;
    settingsDescriptions = data.descriptions || {};
    pendingChanges = {};
    changedSections = {};
    btnApplyRuntime.disabled = true;
    btnApplyAll.disabled = true;
    renderSettings();
  } catch (e) {}
}

function renderSettings() {
  settingsBody.innerHTML = '';
  const sectionLabels = { init: 'Camera Init', runtime: 'Runtime', tracking: 'Tracking', mapping: 'Mapping' };
  const sectionOrder = ['init', 'runtime', 'tracking', 'mapping'];

  sectionOrder.forEach(section => {
    const opts = settingsOptions[section];
    const vals = settingsCurrent[section];
    if (!opts || !vals) return;

    const sec = document.createElement('div');
    sec.className = 'section';

    const header = document.createElement('div');
    header.className = 'section-header';
    header.innerHTML = '<span class="label">' + (sectionLabels[section] || section) + '</span><span class="arrow">&#9660;</span>';
    const body = document.createElement('div');
    body.className = 'section-body';

    header.addEventListener('click', () => {
      body.classList.toggle('open');
      header.querySelector('.arrow').classList.toggle('open');
    });
    if (section === 'init') { body.classList.add('open'); header.querySelector('.arrow').classList.add('open'); }

    Object.keys(vals).forEach(key => {
      if (opts[key]) {
        const desc = (settingsDescriptions[section] || {})[key] || '';
        body.appendChild(buildControl(section, key, vals[key], opts[key], desc));
      }
    });

    sec.appendChild(header);
    sec.appendChild(body);
    settingsBody.appendChild(sec);
  });
}

btnApplyRuntime.addEventListener('click', async () => {
  btnApplyRuntime.disabled = true;
  try {
    await fetch('/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pendingChanges),
    });
    pendingChanges = {};
    changedSections = {};
    btnApplyAll.disabled = true;
  } catch (e) {}
});

btnApplyAll.addEventListener('click', async () => {
  btnApplyRuntime.disabled = true;
  btnApplyAll.disabled = true;
  try {
    await fetch('/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pendingChanges),
    });
    pendingChanges = {};
    changedSections = {};
  } catch (e) {}
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function onResize() {
  const w = scenePanel.clientWidth;
  const h = scenePanel.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

window.addEventListener('resize', onResize);

setInterval(pollStatus, 500);
setInterval(pollPath, 1000);
setInterval(pollPc, 2000);
pollStatus();
pollPath();
animate();
</script>
</body>
</html>
